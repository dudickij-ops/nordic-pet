name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: install
        run: |
          if [ -f package-lock.json ]; then npm ci
          elif [ -f package.json ]; then npm install
          else echo "приложения ещё нет — ставить нечего"; fi

      - name: lint
        run: |
          if [ -f package.json ] && node -e "process.exit(require('./package.json').scripts?.lint?0:1)"; then
            npm run lint
          else echo "команды lint ещё нет"; fi

      - name: test
        run: |
          if [ -f package.json ] && node -e "process.exit(require('./package.json').scripts?.test?0:1)"; then
            npm test
          else echo "команды test ещё нет"; fi
