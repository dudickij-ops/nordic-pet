<meta name="viewport" content="width=device-width, initial-scale=1"><title>otkaz-bazy</title>
<style>/*
 * Вид приложения — кусок S9. Единственная таблица стилей на всё приложение.
 *
 * Подключается ввозом в корневой разметке (`app/layout.tsx`) и больше нигде. Так показывает
 * официальная документация Next: «Create a `app/global.css` file and import it in the root
 * layout to apply the styles to **every route** in your application»
 * (nextjs.org/docs/app/getting-started/css, раздел «Global CSS»). Там же, в разделе
 * «Recommendations», сказано: «Try to contain CSS imports to a single JavaScript or TypeScript
 * entry file». Наш вывод из этого — наш, а не документации: одна точка ввоза заодно оставляет
 * проверки экрана без CSS вовсе, а они отрисовывают разметку и о стилях ничего не утверждают.
 *
 * ЧТО ЭТОТ ФАЙЛ НЕ ДЕЛАЕТ. Он не меняет ни одного числа и ни одной подписи: кусок S9 меняет
 * только то, как показано. Ни одна величина здесь не считается — все числа приходят на экран
 * готовыми строками из слоя метрик.
 *
 * ЧЕМ ЭТОТ ФАЙЛ НЕ СТОРОЖЁН. У таблицы стилей нет слома, и это сказано вслух — в контракте,
 * в README и в теле pull request. Проверка, читающая ввоз в исходном тексте, доказывала бы
 * наличие строки, а не наличие вида. Вид проверяется глазом и снимком.
 *
 * ОРИЕНТИРЫ ВЛАДЕЛЬЦА, по которым он этот вид принимает:
 *   · числа вправо, подписи влево, цифры в колонке одной ширины;
 *   · крупных чисел единицы — прибыль, маржа, окупаемость; остальное ровным весом;
 *   · один цвет для смысловых пометок, красный только для отказов, чтобы он не обесценился;
 *   · плотность средняя: месяц целиком помещается в один-два экрана прокрутки;
 *   · ширина ограничена — строка во весь широкий монитор нечитаема.
 */

/* ——— Величины ——— */

:root {
  /*
   * Величины Fluent 2 — задача 3 куска S10.
   *
   * Имена и значения взяты из официальной реализации токенов Fluent 2 (`microsoft/fluentui`,
   * пакет `packages/tokens/src`). Ни одно число здесь не посчитано нами и ни одно не подобрано на
   * глаз; переносом изменена только запись — пробелы после запятых, — а не значения. Что числа
   * те самые, сторожит проверка `__tests__/styles/fluent-tokens.test.ts` вместе с закрывающим
   * утверждением, что посторонних величин и цветов в файле нет.
   *
   * Тёмная тема — ниже, тем же набором имён и полным составом: у Fluent тёмная тема объявляет
   * все цвета заново, а не правит часть.
   */

  /* Нейтральные: фон, текст, линии. `alias/lightColor.ts`. */
  --colorNeutralBackground1: #ffffff;
  --colorNeutralBackground1Hover: #f5f5f5;
  --colorNeutralBackground1Pressed: #e0e0e0;
  --colorNeutralBackground2: #fafafa;
  --colorNeutralBackground4: #f0f0f0;
  --colorNeutralForeground1: #242424;
  --colorNeutralForeground2: #424242;
  --colorNeutralForeground3: #616161;
  --colorNeutralForegroundDisabled: #bdbdbd;
  --colorNeutralBackgroundDisabled: #f0f0f0;
  --colorNeutralStrokeDisabled: #e0e0e0;
  --colorNeutralForegroundOnBrand: #ffffff;
  --colorNeutralStroke1: #d1d1d1;
  --colorNeutralStroke2: #e0e0e0;
  --colorNeutralStrokeAccessible: #616161;
  --colorSubtleBackgroundHover: #f5f5f5;

  /*
   * Смысловой цвет. Справочник, дословно (fluent2.microsoft.design/color):
   * «Apply brand colors to different areas of an interface not only to create visual prominence,
   * but also to anchor people in a specific product experience. Avoid overusing brand colors or
   * using them on large surfaces as they can dilute a hierarchy and make an experience difficult
   * to navigate.»
   */
  --colorBrandBackground: #0078d4;
  --colorBrandBackgroundHover: #106ebe;
  --colorBrandBackgroundPressed: #004578;
  --colorBrandBackground2: #eff6fc;
  --colorBrandForeground1: #0078d4;
  --colorBrandStroke1: #0078d4;

  /*
   * Обводка фокуса: чёрная в светлой теме, белая в тёмной. **Наш вывод:** такая пара видна на
   * любом фоне; справочник про это не говорит, значения взяты из реализации.
   */
  --colorStrokeFocus2: #000000;

  /*
   * Красный — только отказы. Справочник, дословно (fluent2.microsoft.design/color):
   * «Select colors in the shared palette are specifically used to communicate feedback, status,
   * or urgency. These are known as semantic colors and they should always convey important
   * information.»
   * **Наш вывод:** значит красный не берут на украшение — иначе он перестаёт означать «сломалось».
   */
  --colorPaletteRedBackground1: #fdf6f6;
  --colorPaletteRedBorder1: #f1bbbc;
  --colorPaletteRedBorder2: #d13438;
  --colorPaletteRedForeground1: #bc2f32;

  /* Тень. `utils/shadows.ts` плюс пара цветов тени из `alias/lightColor.ts`. */
  --shadow4: 0 0 2px rgba(0, 0, 0, 0.12), 0 2px 4px rgba(0, 0, 0, 0.14);
  --shadow8: 0 0 2px rgba(0, 0, 0, 0.12), 0 4px 8px rgba(0, 0, 0, 0.14);

  /* Шкала шрифта для веба. `global/fonts.ts`. */
  --fontFamilyBase: 'Segoe UI', 'Segoe UI Web (West European)', -apple-system,
    BlinkMacSystemFont, Roboto, 'Helvetica Neue', sans-serif;
  --fontSizeBase200: 12px;
  --fontSizeBase300: 14px;
  --fontSizeBase400: 16px;
  --fontSizeBase600: 24px;
  --fontSizeHero700: 28px;
  --lineHeightBase200: 16px;
  --lineHeightBase300: 20px;
  --lineHeightBase400: 22px;
  --lineHeightBase600: 32px;
  --lineHeightHero700: 36px;
  --fontWeightRegular: 400;
  --fontWeightSemibold: 600;

  /* Скругления, толщины, отступы, движение. */
  --borderRadiusMedium: 4px;
  --borderRadiusXLarge: 8px;
  --borderRadius2XLarge: 12px;
  --borderRadiusCircular: 10000px;
  --strokeWidthThin: 1px;
  --strokeWidthThick: 2px;
  --spacingHorizontalS: 8px;
  --spacingHorizontalM: 12px;
  --spacingHorizontalL: 16px;
  --spacingHorizontalXL: 20px;
  --spacingHorizontalXXL: 24px;
  --spacingVerticalXS: 4px;
  --spacingVerticalS: 8px;
  --spacingVerticalM: 12px;
  --spacingVerticalL: 16px;
  --spacingVerticalXL: 20px;
  --spacingVerticalXXL: 24px;
  --spacingVerticalXXXL: 32px;
  /*
   * Собственные величины кнопки Fluent: в реализации они стоят числами рядом с правилами
   * (`react-button/…/useButtonStyles.styles.ts`), а не в шкале отступов. Имена наши, значения его.
   */
  /* Высота строки таблицы — малый размер Fluent (`react-table/…/useTableCellStyles.styles.ts`:
   * medium 44, small 34, extra-small 24). Из трёх взят малый; довод — у правила. */
  --tableRowHeightSmall: 34px;

  --buttonSpacingSmall: 3px;
  --buttonSpacingMedium: 5px;
  --buttonMinWidthSmall: 64px;
  --buttonMinWidthMedium: 96px;

  --durationFaster: 100ms;
  --curveEasyEase: cubic-bezier(0.33, 0, 0.67, 1);

  /*
   * Наши имена поверх токенов. Правила экрана ходят пока через них; задачи 4–9 переводят
   * правила на токены напрямую, и слой имён тает вместе с ними.
   *
   * Холст и карточка — одного цвета. Основание — два показанных Microsoft примера: корень
   * приложения Fluent ставит `colorNeutralBackground1` и на холст, и на карточку
   * (`react-provider/…/useFluentProviderStyles.styles.ts`), а вёрстка сайта fluent2.microsoft.design
   * рисует плитку как `background-color: var(--colorNeutralBackground1); border: 1px solid
   * var(--colorNeutralBackground1Pressed); border-radius: 8px` с тенью `shadow4`. **Наш вывод:**
   * значит разделять их должны рамка, скругление и тень.
   *
   * **Сегодня из трёх работает одна рамка.** Тень объявлена величиной и ни одним правилом ещё не
   * взята: карточки, тени и скругления — задача 5. До неё карточка отделяется от холста только
   * рамкой, и это меньше, чем сказано выше.
   */
  --bg: var(--colorNeutralBackground4);
  --surface: var(--colorNeutralBackground1);
  --text: var(--colorNeutralForeground1);
  --text-dim: var(--colorNeutralForeground3);
  /* Линия внутри карточек — разделители строк неполноты. Рамок у карточек больше нет. */
  --line: var(--colorNeutralBackground1Pressed);
  --line-strong: var(--colorNeutralStroke1);
  --accent: var(--colorBrandBackground);
  --accent-text: var(--colorBrandForeground1);
  --accent-line: var(--colorBrandStroke1);
  --accent-soft: var(--colorBrandBackground2);
  --on-accent: var(--colorNeutralForegroundOnBrand);
  --danger: var(--colorPaletteRedForeground1);
  /*
   * Рамка плашки отказа берёт `Border2`, а не `Border1`. Найдено проверкой кода. **Наш замер,
   * все три числа:** `Border1` (#f1bbbc) даёт к холсту 1,67 : 1, и коробка отказа перестаёт
   * читаться коробкой — остаётся один красный текст; `Border2` даёт 4,93 : 1 в светлой теме и
   * 5,20 : 1 в тёмной. Ни одно из этих чисел в документации Fluent не названо — это наш счёт по
   * формуле контраста, а не выписка.
   */
  --danger-line: var(--colorPaletteRedBorder2);
  --danger-soft: var(--colorPaletteRedBackground1);

  --radius: var(--borderRadiusXLarge);
  --gap: var(--spacingVerticalL);
  --font: var(--fontFamilyBase);

  /*
   * Предельная ширина содержимого — допущение, а не число Fluent: раздел «Grid» справочника
   * говорит про колонки, поля и жёлобы, но ни одного пикселя не называет. Названо допущением в
   * контракте и в списке исключений проверки величин.
   */
  --page: 72rem;
}

@media (prefers-color-scheme: dark) {
  :root {
    /* Тёмная тема Fluent объявляет цвета заново, полным составом. `alias/darkColor.ts`. */
    --colorNeutralBackground1: #292929;
    --colorNeutralBackground1Hover: #3d3d3d;
    --colorNeutralBackground1Pressed: #1f1f1f;
    --colorNeutralBackground2: #1f1f1f;
    --colorNeutralBackground4: #0a0a0a;
    --colorNeutralForeground1: #ffffff;
    --colorNeutralForeground2: #d6d6d6;
    --colorNeutralForeground3: #adadad;
    --colorNeutralForegroundDisabled: #5c5c5c;
    --colorNeutralBackgroundDisabled: #141414;
    --colorNeutralStrokeDisabled: #424242;
    --colorNeutralForegroundOnBrand: #ffffff;
    --colorNeutralStroke1: #666666;
    --colorNeutralStroke2: #525252;
    --colorNeutralStrokeAccessible: #adadad;
    --colorSubtleBackgroundHover: #383838;

    --colorBrandBackground: #106ebe;
    --colorBrandBackgroundHover: #0078d4;
    --colorBrandBackgroundPressed: #004578;
    --colorBrandBackground2: #002848;
    --colorBrandForeground1: #2899f5;
    --colorBrandStroke1: #2899f5;

    --colorStrokeFocus2: #ffffff;

    --colorPaletteRedBackground1: #3f1011;
    --colorPaletteRedBorder1: #d13438;
    --colorPaletteRedBorder2: #e37d80;
    --colorPaletteRedForeground1: #e37d80;

    /* Тень в тёмной теме гуще: пара цветов своя. `alias/darkColor.ts`. */
    --shadow4: 0 0 2px rgba(0, 0, 0, 0.24), 0 2px 4px rgba(0, 0, 0, 0.28);
    --shadow8: 0 0 2px rgba(0, 0, 0, 0.24), 0 4px 8px rgba(0, 0, 0, 0.28);

  }
}

/* ——— Основа ——— */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  color-scheme: light dark;
}

body {
  margin: 0;
  padding: var(--spacingVerticalXXL) var(--spacingHorizontalXXL) var(--spacingVerticalXXXL);
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: var(--fontSizeBase300);
  line-height: var(--lineHeightBase300);
  /*
   * Ширина ограничена здесь, а не на `main`: разметка страницы отчёта — это несколько соседей
   * в корне (кнопка выхода, пометка устаревания, панель кнопки), и ограничивать надо их все
   * разом, иначе шапка разъедется шире чисел.
   */
  max-width: var(--page);
  margin-inline: auto;
}

/*
 * Табличные цифры — всюду, а не только в таблице товаров. В столбце денег разряды обязаны
 * стоять друг под другом; пропорциональные цифры сдвигают их на доли символа, и глаз перестаёт
 * читать колонку как колонку.
 */
body {
  font-variant-numeric: tabular-nums;
  font-feature-settings: 'tnum' 1;
}

/*
 * Шкала шрифта — задача 4 куска S10. Каждый размер взят из шкалы Fluent для веба и стоит
 * величиной, а не числом.
 *
 * **Что чем является.** Сами ступени — размер и интерлиньяж в паре — выписаны из
 * `global/fonts.ts` и `global/typographyStyles.ts`. А вот **какая ступень какой роли на этом
 * экране достаётся — наш вывод**: справочник даёт шкалу и семантические имена, но про подпись
 * показателя в приборной панели магазина не говорит ничего.
 *
 * Заголовок отчёта — Title 3 (24 / 32, 600), **наш вывод**. Межбуквенное расстояние снято:
 * своего числа у него не было ни у Fluent, ни у нас — оно было подобрано на глаз.
 */
h1 {
  margin: 0;
  font-size: var(--fontSizeBase600);
  line-height: var(--lineHeightBase600);
  font-weight: var(--fontWeightSemibold);
}

/*
 * Заголовок блока — Body 1 Strong (14 / 20, 600), цвет `colorNeutralForeground2`.
 *
 * **Показанный пример, дословно.** Сайт fluent2.microsoft.design набирает заголовок плитки так:
 * `.tile .tile-header .header-title{font-size:14px;line-height:20px;font-weight:600;
 * color:var(--colorNeutralForeground2)}`. **Наш вывод:** заголовку блока на этом экране
 * достаётся та же ступень.
 *
 * **Иерархия заголовка — замер и закрытый вопрос.** Заголовок отличается от основного текста
 * только насыщенностью: размер тот же, цвет светлее. Наш замер обеих пар: заголовок против
 * основного текста — **1,54 : 1 в светлой теме и 1,45 : 1 в тёмной**; смотреть надо на тёмную,
 * она слабее. Владелец посмотрел экран после задачи 5 и вопрос закрыл: заголовок держит сама
 * карточка, поднимать ступень не нужно.
 *
 * **Капитель снята.** Справочник, дословно (fluent2.microsoft.design/typography, «Styling text»,
 * подраздел «Casing»): «Use sentence case when writing, it fits most contexts. Don’t use all caps
 * to get a user’s attention because it’s difficult to read. See the content design guidance for
 * more information.» Буквы в разметке при этом не двинулись ни на символ: капитель делалась
 * показом, а не текстом.
 */
h2 {
  margin: 0 0 var(--spacingVerticalM);
  font-size: var(--fontSizeBase300);
  line-height: var(--lineHeightBase300);
  font-weight: var(--fontWeightSemibold);
  color: var(--colorNeutralForeground2);
}

p {
  margin: 0 0 0.5rem;
}

/* ——— Блоки ——— */

/*
 * Карточка — задача 7а куска S10, вид по образцу заказчика.
 *
 * **Здесь отступление не добавилось, а исчезло.** Задача 5 ставила рамку и тень одновременно,
 * следуя показанному примеру, и это было названо отступлением от буквы справочника. Теперь рамки
 * нет, и та же цитата с тем же условием описывает ровно то, что мы делаем:
 * fluent2.microsoft.design/elevation, таблица «Low elevation ramp», строка светлой темы —
 * `shadow4` для «Cards without an edge», карточек **без рамки**; следующая ступень той же
 * таблицы — `shadow8` для «Floating action buttons, raised cards, and raised app bars».
 * **Наш вывод:** карточка отчёта — «raised card», и ей достаётся `shadow8`.
 *
 * Холст при этом отделён от карточки цветом: `colorNeutralBackground4` под
 * `colorNeutralBackground1`. Это отмена решения развилки 1 от 8 сентября, причина названа в
 * плане — заказчик прислал образец вида.
 */
section {
  margin: 0 0 var(--gap);
  padding: var(--spacingVerticalXL) var(--spacingHorizontalXL);
  background: var(--surface);
  border-radius: var(--borderRadius2XLarge);
  box-shadow: var(--shadow8);
}

/* ——— Пары «подпись — значение» ——— */

/*
 * Список определений раскладывается колонками: подпись сверху, значение снизу. Так пара
 * читается как одно целое, а соседние показатели встают в ряд и сравниваются глазом.
 */
dl {
  display: grid;
  /*
   * Ровно четыре колонки, и каждая может ужаться до нуля (`minmax(0, 1fr)`).
   *
   * Здесь была ошибка, найденная глазом на узком экране: колонки задавались через
   * `repeat(auto-fit, minmax(11rem, 1fr))`, а строки у подписи и значения закреплены
   * (`grid-row: 1` и `grid-row: 2`). Закреплённая строка заставляет все пары встать в один ряд:
   * сетка добавляет неявные колонки сверх заданных, и `auto-fit` их не сворачивает. На экране
   * шириной 375 пикселей разметка расползалась до 559 и уезжала за край.
   *
   * Четыре — потому что больше четырёх показателей в блоке нет ни в одном из трёх блоков.
   */
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--spacingVerticalL) var(--spacingHorizontalXXL);
  margin: 0;
}

/* Подпись показателя — Caption 1 (12 / 16, 400). */
dt {
  grid-row: 1;
  font-size: var(--fontSizeBase200);
  line-height: var(--lineHeightBase200);
  color: var(--text-dim);
}

/* Обычное значение — Subtitle 2 (16 / 22, 600). Крупных чисел на экране трое, и они ниже. */
dd {
  grid-row: 2;
  margin: 0;
  font-size: var(--fontSizeBase400);
  line-height: var(--lineHeightBase400);
  font-weight: var(--fontWeightSemibold);
  /*
   * Значение не рвётся между числом и знаком. Этим закрыта отложенная задача прежнего куска:
   * `money` и `percent` ставят перед знаком обычный пробел, и без запрета знак евро мог уехать
   * на другую строку. Сам формат при этом не тронут ни на символ.
   */
  white-space: nowrap;
}

/* ——— Таблица ——— */

table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--fontSizeBase300);
  line-height: var(--lineHeightBase300);
}

/*
 * Таблица товаров — задача 7 куска S10.
 *
 * Из реализации Fluent: высота строки малого размера 34, отступы ячейки `0 8px`, нижняя граница
 * строки в толщину `strokeWidthThin` цветом `colorNeutralStroke2`, наведение на строку —
 * `colorSubtleBackgroundHover`.
 *
 * **Почему малый размер, а не средний.** Fluent называет три высоты и не говорит, какую брать для
 * приборной панели, — **наш вывод**: двенадцать товаров при среднем размере занимают 528 пикселей
 * вместо 408, и ориентир владельца «месяц помещается в один-два экрана прокрутки» перестаёт
 * выполняться.
 */
th,
td {
  height: var(--tableRowHeightSmall);
  padding: 0 var(--spacingHorizontalS);
  border-bottom: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
  text-align: left;
}

tbody tr:hover {
  background: var(--colorSubtleBackgroundHover);
}

/* Числа вправо, подписи влево: первая колонка — артикул, остальные — числа. */
th:not(:first-child),
td:not(:first-child) {
  text-align: right;
}

/*
 * Не рвётся только значение. Заголовкам колонок перенос разрешён нарочно: с запретом
 * «Продано за вычетом возвратов» держало таблицу шириной в 621 пиксель, и в полосе примерно
 * 641…661 пикселя за край уезжала вся страница, а не таблица. Замерено: при 645 пикселях
 * ширина страницы была 662.
 */
td {
  white-space: nowrap;
}

/*
 * Заголовок колонки — Caption 1 (12 / 16) обычной насыщенности.
 *
 * **Что взято у Fluent, а что решено нами.** У Fluent задана только насыщенность:
 * `react-table/…/useTableHeaderCellStyles.styles.ts` ставит `fontWeight: tokens.fontWeightRegular`
 * и размера не задаёт вовсе — значит у него заголовок колонки идёт размером таблицы, то есть
 * Body 1 (14). **Наш вывод и наше отступление:** здесь заголовок колонки взял Caption 1 (12),
 * потому что колонок пять и они соперничают за ширину с числами, а называет колонку положение,
 * а не размер. Насыщенность оставлена той, что у Fluent.
 */
thead th {
  font-size: var(--fontSizeBase200);
  line-height: var(--lineHeightBase200);
  font-weight: var(--fontWeightRegular);
  color: var(--text-dim);
  border-bottom: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
  /*
   * Шапка держится при прокрутке — **шире 48 rem, и только там**. Фон обязателен: без него
   * строки просвечивают сквозь прилипшую шапку.
   *
   * Ограничение названо, потому что оно неустранимо в этой разметке, а не потому, что руки не
   * дошли. Уже 48 rem таблица становится собственным контейнером прокрутки (`overflow-x`), а по
   * правилу CSS вторая ось при этом тоже перестаёт быть `visible` — и `sticky` начинает
   * считаться от прокрутки таблицы, которой по вертикали нет. Замерено: при 760 пикселях
   * верх шапки уезжает на −200 при прокрутке на 200, при 1200 — остаётся нулём.
   *
   * Развести это можно было бы обёрткой в разметке, но обёртка сдвинула бы отступы строк,
   * которые цитируют сломы прежних кусков. Прокрутка таблицы на узком экране важнее липкой
   * шапки: без неё за край уезжает вся страница. Отступление названо в README и в теле
   * pull request.
   */
  position: sticky;
  top: 0;
  background: var(--surface);
}

tbody tr:last-child td {
  border-bottom: none;
}

/* ——— Ссылки и кнопки ——— */

a {
  color: var(--accent-text);
}

/*
 * Кнопка — задача 6 куска S10, средний размер Fluent.
 *
 * Из реализации (`react-button/…/useButtonStyles.styles.ts`): отступы 5 / 12, наименьшая ширина
 * 96, скругление `borderRadiusMedium`, шрифт 14 / 20 насыщенностью 600, рамка в толщину
 * `strokeWidthThin` цветом `colorNeutralStroke1`, наведение — `colorNeutralBackground1Hover`,
 * нажатие — `colorNeutralBackground1Pressed`, переход 100 ms кривой `curveEasyEase`.
 */
button {
  font-family: var(--font);
  font-size: var(--fontSizeBase300);
  line-height: var(--lineHeightBase300);
  font-weight: var(--fontWeightSemibold);
  color: var(--text);
  background: var(--surface);
  border: var(--strokeWidthThin) solid var(--line-strong);
  border-radius: var(--borderRadiusMedium);
  padding: var(--buttonSpacingMedium) var(--spacingHorizontalM);
  min-width: var(--buttonMinWidthMedium);
  cursor: pointer;
  transition: background var(--durationFaster) var(--curveEasyEase),
    border-color var(--durationFaster) var(--curveEasyEase),
    color var(--durationFaster) var(--curveEasyEase);
}

button:hover:not(:disabled) {
  background: var(--colorNeutralBackground1Hover);
}

button:active:not(:disabled) {
  background: var(--colorNeutralBackground1Pressed);
}

/*
 * Отключённая кнопка берёт **свой цвет**, а не прозрачность.
 *
 * Прозрачность делает получившийся контраст зависимым от того, что лежит под элементом, то есть
 * непредсказуемым на любом фоне. Цвета — из реализации Fluent: `colorNeutralBackgroundDisabled`,
 * `colorNeutralForegroundDisabled`, `colorNeutralStrokeDisabled`.
 *
 * **Наш замер, и он не в пользу перемены по числу:** прежняя прозрачность 0,55 давала 2,21 : 1 в
 * светлой теме, цвета Fluent дают 1,65 : 1; в тёмной было 3,24 : 1, стало 2,76 : 1. Ни одно из
 * четырёх не дотягивает до 4,5 : 1. Перемена решает названную владельцем беду —
 * непредсказуемость, — и не решает числа.
 *
 * **Порог сюда не применяется, и вот дословное основание.** WCAG 2.1, критерий 1.4.3 Contrast
 * (Minimum), перечень исключений, целиком: «The visual presentation of text and images of text has
 * a contrast ratio of at least 4.5:1, except for the following: **Large Text** Large-scale text and
 * images of large-scale text have a contrast ratio of at least 3:1; **Incidental** Text or images
 * of text that are part of an inactive user interface component, that are pure decoration, that
 * are not visible to anyone, or that are part of a picture that contains significant other visual
 * content, have no contrast requirement; **Logotypes** Text that is part of a logo or brand name
 * has no contrast requirement.» (w3.org/TR/WCAG21/)
 *
 * **Наш вывод:** отключённая кнопка — «inactive user interface component», и порога у неё нет.
 * Это не оправдание числа, а ответ на вопрос, отступление ли это: не отступление. Числа при этом
 * названы выше, а не спрятаны за исключением.
 */
button:disabled {
  color: var(--colorNeutralForegroundDisabled);
  background: var(--colorNeutralBackgroundDisabled);
  border-color: var(--colorNeutralStrokeDisabled);
  cursor: not-allowed;
}

/*
 * Движение уважает настройку человека: `prefers-reduced-motion: reduce` сводит переход к
 * мгновенному, как это делает сам Fluent (`@media screen and (prefers-reduced-motion: reduce)` в
 * его же файле кнопки).
 */
@media (prefers-reduced-motion: reduce) {
  button {
    transition-duration: 0.01ms;
  }
}

/*
 * Обводка фокуса — единственный новый механизм куска: прежде на экране не было ни одного правила
 * фокуса вовсе. Форма взята у Fluent (`react-table/…/useTableRowStyles.styles.ts` и прочие):
 * `outline: 2px solid colorStrokeFocus2`. Токен чёрный в светлой теме и белый в тёмной, поэтому
 * обводка видна на любом фоне.
 *
 * **Слома у этого правила нет, и это названо** — в списке сломов, в плане, в теле pull request и
 * в отчёте. Доказательство ему только снимок и глаз.
 */
:focus-visible {
  outline: var(--strokeWidthThick) solid var(--colorStrokeFocus2);
  outline-offset: var(--strokeWidthThin);
}

/* ——— Пометки и отказы ——— */

/*
 * Пометка — смысловой цвет. Отказ — красный, и красный больше нигде: цвет, потраченный на
 * украшение, перестаёт означать «сломалось».
 */
/*
 * `clear` обязателен: кнопка выхода — плавающая, а обычный блок под плавающим не отступает, и
 * пометка «числа отстали» накрывала кнопку своей коробкой — «Выйти» читалось как часть плашки.
 * Замерено на узком экране: коробка пометки 14…376, форма выхода 310…376, то есть целиком
 * внутри. Найдено проверкой кода. Цена решения названа: на экране холодного открытия кнопка
 * обновления уходит на свою строку, и это правильнее наложения.
 */
[role='status'] {
  clear: right;
  margin: 0 0 var(--gap);
  padding: var(--spacingVerticalM) var(--spacingHorizontalL);
  background: var(--accent-soft);
  color: var(--text);
  border: var(--strokeWidthThin) solid var(--accent-line);
  border-radius: var(--borderRadius2XLarge);
}

/*
 * `clear` у отказа — по той же причине, что у пометки, и найдено на снимке: полоса управления
 * плавает справа, а коробка блочного элемента заходит под плавающее — текст обтекает, а фон нет.
 * Плашка отказа уезжала под кнопки, и «Обновить данные» стояла поверх красного поля.
 */
[role='alert'] {
  clear: right;
  margin: 0 0 var(--gap);
  padding: var(--spacingVerticalM) var(--spacingHorizontalL);
  background: var(--danger-soft);
  color: var(--danger);
  border: var(--strokeWidthThin) solid var(--danger-line);
  border-radius: var(--borderRadius2XLarge);
}

/* ——— Верхняя полоса и полоса действия ——— */

/*
 * Кнопка выхода держит собственную форму: формы в HTML не вкладываются, а отчёт уже завёрнут
 * в форму кнопки «Обновить данные». Поэтому верхняя полоса собирается здесь, стилями, а не
 * обёрткой в разметке.
 */
.logout {
  /*
   * Обтекание, а не флексбокс-строка: кнопка выхода и кнопка обновления живут в разных формах
   * и разной глубине (формы в HTML не вкладываются), поставить их в один ряд общим родителем
   * нельзя. Плавающая форма выводится из потока, а полоса действия ниже — контейнер флексбокса,
   * и потому не наезжает на плавающее, а встаёт рядом. Так обе кнопки оказываются в одной
   * строке без единой обёртки в разметке.
   */
  float: right;
  margin: 0 0 0.75rem 1rem;
}

/*
 * Рамка видна всегда. На странице отказа «данные не читаются» эта кнопка — единственный орган
 * управления на экране, а с прозрачной рамкой она до наведения читалась словом, а не кнопкой.
 * Найдено проверкой кода.
 */
.logout button {
  padding: var(--buttonSpacingSmall) var(--spacingHorizontalS);
  min-width: var(--buttonMinWidthSmall);
  font-size: var(--fontSizeBase200);
  line-height: var(--lineHeightBase200);
  font-weight: var(--fontWeightRegular);
  color: var(--text);
  background: var(--surface);
  border-color: var(--line-strong);
}

/*
 * Полоса действия — задача 6 куска S10, и приём в ней стоит объяснения.
 *
 * **Была беда:** кнопка обновления стояла над строкой названия, месяцы — на самой строке, и
 * получались две полосы управления вместо одной, а главное действие экрана висело выше названия
 * отчёта, ни к чему не привязанное. Найдено владельцем на снимке.
 *
 * **Почему стилями, а не разметкой.** Кнопка обновления и название отчёта лежат в разных ветвях
 * разметки и на разной глубине: собрать их в один ряд общим родителем нельзя, а разметку этот
 * кусок не открывает вовсе. Плавающая полоса выводится из потока, и шапка отчёта — контейнер
 * флексбокса, то есть собственный контекст форматирования — не наезжает на плавающее, а встаёт
 * рядом. Так название, месяцы и обе кнопки оказываются на одной полосе без единой правки тегов.
 */
.actions {
  float: right;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  min-height: var(--lineHeightBase600);
  margin: 0 0 var(--gap) var(--spacingHorizontalS);
}

button.primary {
  color: var(--on-accent);
  background: var(--accent);
  border-color: transparent;
}

button.primary:hover:not(:disabled) {
  color: var(--on-accent);
  background: var(--colorBrandBackgroundHover);
}

button.primary:active:not(:disabled) {
  color: var(--on-accent);
  background: var(--colorBrandBackgroundPressed);
}

/* ——— Заголовок отчёта и месяцы ——— */

.report-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--spacingVerticalM) var(--spacingHorizontalXXL);
  margin: 0 0 var(--gap);
}

.months ul {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
  margin: 0;
  padding: 0;
  list-style: none;
}

.months a {
  display: inline-block;
  padding: var(--buttonSpacingSmall) var(--spacingHorizontalS);
  border: var(--strokeWidthThin) solid var(--line-strong);
  border-radius: var(--borderRadiusMedium);
  background: var(--surface);
  color: var(--text);
  text-decoration: none;
  font-size: var(--fontSizeBase200);
  line-height: var(--lineHeightBase200);
}

.months a:hover {
  background: var(--colorNeutralBackground1Hover);
}

/* Выбранный месяц назван и разметкой (`aria-current`), и видом — не только цветом. */
.months a[aria-current='page'] {
  background: var(--accent);
  border-color: transparent;
  color: var(--on-accent);
  font-weight: var(--fontWeightSemibold);
}

/*
 * Месяц без заказов виден, но не зовёт: он в списке потому, что есть реклама или расходы.
 * Приглушается пунктиром рамки, а не прозрачностью: это орган управления, и читаться он обязан
 * не хуже соседей. Прозрачность 0,6 давала около 2,7 : 1.
 */
.months a[data-empty='true'] {
  border-style: dashed;
}

/*
 * Выбранный месяц без заказов. Без этой строки пунктир шёл рамкой в цвет заливки и не читался
 * вовсе: выбранный пустой месяц был неотличим от выбранного обычного. Найдено проверкой кода.
 */
.months a[data-empty='true'][aria-current='page'] {
  border-color: var(--on-accent);
}

/* ——— Главные числа ——— */

/*
 * Крупных чисел на экране ровно три — прибыль, маржа, окупаемость. Остальные показатели идут
 * ровным весом. Экран, где выделено всё, не выделяет ничего.
 *
 * **Отступление, названное вслух.** Справочник, дословно (fluent2.microsoft.design/color): «Apply
 * brand colors to different areas of an interface not only to create visual prominence, but also
 * to anchor people in a specific product experience. Avoid overusing brand colors or using them on
 * large surfaces as they can dilute a hierarchy and make an experience difficult to navigate.»
 * Карточка «Итог» идёт на смысловом цвете — то есть против второй половины этой цитаты. Довод
 * владельца: одна карточка из шести, и она главная на экране. Названо здесь, в описи снимков и в
 * теле pull request.
 */
.bottom-line {
  background: var(--accent);
  color: var(--on-accent);
}

.bottom-line h2,
.bottom-line dt,
.bottom-line dd {
  color: var(--on-accent);
}

/* Три крупных числа — Title 2 (28 / 36, 600). Их ровно три, и больше на экране крупного нет. */
.bottom-line dd {
  font-size: var(--fontSizeHero700);
  line-height: var(--lineHeightHero700);
  font-weight: var(--fontWeightSemibold);
}

/* ——— Полоса доли честности ——— */

/*
 * Второй показ **того же** числа, а не новое число: ширина берётся из той же величины, которую
 * печатает текст рядом. Ни деления, ни вычитания в разметке нет. Полоса помечена `aria-hidden`:
 * читалке экрана она сказала бы то же самое второй раз.
 */
.share {
  /*
   * Ширина ограничена нарочно. Полоса во всю строку делает 80 % и 100 % почти неразличимыми:
   * глазу нужен видимый остаток, иначе полоса врёт видом, не соврав числом.
   */
  max-width: 26rem;
  height: 8px;
  margin: 0.6rem 0 0.9rem;
  background: var(--line);
  border-radius: 999px;
  overflow: hidden;
}

.share-fill {
  /*
   * `clamp` здесь — сторож, а не украшение. Значение приходит величиной `--share` из разметки;
   * если оно окажется отрицательным или больше ста, длина всё равно останется в пределах
   * дорожки. Прежде значение подставлялось прямо в `width`, и отрицательная доля делала
   * объявление негодным: браузер брал ширину по умолчанию и рисовал полосу во всю дорожку —
   * то есть «посчитано всё» там, где текст рядом говорил «минус двенадцать процентов».
   *
   * Доли вне 0…100 в настоящих данных не встречались ни разу; арифметически они возможны,
   * потому что чистая выручка строки уходит в минус при крупном возврате.
   */
  width: clamp(0%, var(--share, 0%), 100%);
  height: 100%;
  background: var(--accent);
  border-radius: 999px;
}

.share-value {
  font-size: var(--fontSizeBase400);
  line-height: var(--lineHeightBase400);
  font-weight: var(--fontWeightSemibold);
}

/*
 * Нулевая дыра видна, но не кричит — она идёт базовым приглушённым цветом строки, и своего
 * правила ей не нужно. Отдельное правило здесь стояло и не делало ничего: цвет в нём совпадал
 * с базовым. Найдено проверкой кода.
 *
 * Заметной делается ненулевая. Приглушение прозрачностью убрано на круг раньше: 0,65 поверх
 * приглушённого текста давало контраст около 2,8 : 1 при норме 4,5 : 1.
 */
.gaps li:not([data-zero='true']) {
  color: var(--text);
  font-weight: 550;
}

/*
 * Второй абзац блока — оговорка про товары без цены поставщика.
 *
 * Здесь дважды промахнулись мимо цели, и оба промаха названы. Сначала стоял `p:last-of-type`:
 * когда товаров без цены нет, второго абзаца не существует, и правило гасило подпись доли.
 * Потом — `p + p`: между абзацами стоит полоса, соседями они не являются, и правило не
 * совпадало **ни с чем**. Замерено: ноль совпадений, оба абзаца одного размера и цвета.
 * Второй промах нашла проверка кода, первый — она же кругом раньше.
 */
/*
 * Проза остаётся прозой: Body 1, приглушённым цветом. Caption 1 у Fluent — подпись, а не абзац,
 * и загонять в неё связный текст значило бы взять ступень не по роли.
 */
.honesty > p:nth-of-type(2) {
  margin-bottom: 0;
  color: var(--text-dim);
  font-size: var(--fontSizeBase300);
  line-height: var(--lineHeightBase300);
}

/* ——— Неполнота ——— */

.gaps > p {
  color: var(--text-dim);
  font-size: var(--fontSizeBase300);
  line-height: var(--lineHeightBase300);
}

.gaps ul {
  margin: 0;
  padding: 0;
  list-style: none;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(19rem, 1fr));
  gap: 0 1.5rem;
}

/*
 * Раскладки в две колонки здесь нет, и это решение, а не упущение. Содержимое строки — один
 * сплошной кусок текста «вид: число»: разделить его на подпись и значение можно было бы только
 * вложенными тегами, а принятая проверка прошлого куска утверждает, что «скидки: 0» стоит на
 * экране одной неразрывной строкой. Прежде здесь стоял флексбокс с раскладкой по краям — он не
 * делал ничего вовсе: распределять между краями было нечего. Найдено проверкой кода.
 */
/*
 * Строка неполноты. Найдено владельцем на снимке: единственная ненулевая строка переносится на
 * две, и ряд разделителей вокруг неё выглядит сломанным.
 *
 * **Замер показал, что рвутся не разделители, а воздух.** Границы соседей по ряду сходятся до
 * пикселя: сетка растягивает все три ячейки на высоту самой высокой — 52 против 32. Разъезжается
 * текст: у однострочных соседей он прижат к верху рослой ячейки, и под ним остаётся дыра. Поэтому
 * текст ставится по середине ячейки, а не по её верху.
 */
.gaps li {
  display: flex;
  align-items: center;
  padding: var(--spacingVerticalXS) 0;
  border-bottom: var(--strokeWidthThin) solid var(--line);
  font-size: var(--fontSizeBase300);
  line-height: var(--lineHeightBase300);
  color: var(--text-dim);
}

/* ——— Устаревшие числа ——— */

/*
 * Гашение — видом, а не только текстом: человек, увидевший прежние числа в прежнем виде,
 * прочитал бы отказ как «ничего не изменилось». Атрибут состояния остаётся на месте.
 */
/*
 * Имя класса разведено с именем класса пометки нарочно. Прежде обёртка звалась `stale`, а
 * пометка над ней — `stale-mark`, и проверка, искавшая слово «stale» в атрибуте класса, находила
 * пометку вместо обёртки: слом, снимавший класс с обёртки, проходил зелёным. Найдено прогоном
 * сломов, а не глазом.
 */
/*
 * Гашение устаревших чисел — **обесцвечиванием, без прозрачности**.
 *
 * Прозрачность отсюда убрана по той же причине, по какой она ушла с отключённой кнопки: она
 * смешивает текст с тем, что под ним, и контраст перестаёт быть предсказуемым. Здесь он ещё и
 * проваливался: **наш замер** при прежних 0,55 — основной текст на карточке 3,59 : 1 в светлой
 * теме, подпись показателя 2,38 : 1; чтобы подпись удержала 4,5 : 1, прозрачность пришлось бы
 * поднять почти до непрозрачной, то есть перестать гасить вовсе.
 *
 * Обесцвечивание контраста нейтрального текста не трогает совсем, а самый громкий элемент экрана
 * — цветная карточка «Итог» — становится серым, и это видно сразу. **Наш замер после перемены:**
 * белый текст на посеревшем «Итоге» — 5,83 : 1 в светлой теме и 6,29 : 1 в тёмной; основной текст
 * и подписи остаются при своих 15,52 : 1 и 6,19 : 1.
 *
 * Так на экране не осталось ни одного места, где приглушение делается прозрачностью.
 */
.numbers-stale {
  filter: grayscale(1);
}

/*
 * Пометка устаревания приводится к одному виду с пометкой холодного открытия.
 *
 * Их две и они об одном: «числа отстали» приходит при открытии страницы, «числа ниже устарели» —
 * после неудачного нажатия кнопки. Прежде первая была плашкой во всю ширину, вторая — голым
 * жирным текстом на холсте. Теперь обе — плашка одной формы: те же отступы, то же скругление, та
 * же рамка.
 *
 * **Цвет у них всё же разный, и это не недоделка.** Вторая живёт внутри блока устаревших чисел, а
 * он обесцвечен нарочно, — значит и плашка внутри него выходит серой. Это то же самое сообщение,
 * показанное в том же обесцвеченном слое, а не второй вид пометки.
 */
.stale-mark {
  margin: 0 0 var(--gap);
  padding: var(--spacingVerticalM) var(--spacingHorizontalL);
  background: var(--accent-soft);
  color: var(--text);
  border: var(--strokeWidthThin) solid var(--accent-line);
  border-radius: var(--borderRadius2XLarge);
  font-weight: var(--fontWeightSemibold);
}

/* ——— Страница входа ——— */

.login {
  max-width: 22rem;
  margin: 12vh auto 0;
  padding: var(--spacingVerticalXXL) var(--spacingHorizontalXXL);
  background: var(--surface);
  border-radius: var(--borderRadius2XLarge);
  box-shadow: var(--shadow8);
}

.login h1 {
  margin: 0 0 var(--spacingVerticalXXL);
  font-size: var(--fontSizeBase400);
  line-height: var(--lineHeightBase400);
}

.login label {
  display: block;
  margin: 0 0 var(--spacingVerticalXS);
  font-size: var(--fontSizeBase200);
  line-height: var(--lineHeightBase200);
  color: var(--text-dim);
}

.login input {
  display: block;
  width: 100%;
  margin: 0 0 1rem;
  padding: 0.5rem 0.65rem;
  font: inherit;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--line-strong);
  border-radius: 8px;
}

.login button {
  width: 100%;
}

.login [role='alert'] {
  margin: 1rem 0 0;
}

/* ——— Узкий экран ——— */

/*
 * Прокрутка таблицы — своим условием и раньше общего узкого вида. Общее условие стоит на
 * 40 rem, а таблице тесно уже примерно с 41 rem, и в этой полосе за край уезжала вся страница.
 *
 * Цена приёма названа: `display: block` снимает с таблицы табличную семантику в части читалок
 * экрана, и числа теряют связь с заголовками колонок. Обёртка в разметке была бы лучше, но она
 * сдвинула бы отступы строк, которые цитируют сломы прежних кусков.
 */
/*
 * Прокрутка таблицы переехала с самой таблицы на карточку «Товары» — задача 7.
 *
 * **Что этим закрыто.** Прежде на узком экране таблица получала `display: block`, и в части
 * читалок экрана числа теряли связь с заголовками колонок: табличная семантика снималась. Это
 * было названной ценой прошлого куска. Теперь таблица остаётся таблицей, а прокручивается блок
 * вокруг неё.
 *
 * **Что этим НЕ закрыто, и это остаётся названным.** Липкая шапка на узком экране не работает и
 * не заработает: пока карточка — контейнер горизонтальной прокрутки, вторая ось перестаёт быть
 * `visible`, и `sticky` считается от прокрутки карточки, которой по вертикали нет.
 *
 * **Наш замер в настоящем браузере на этой раскладке.** Прокрутка страницы на 900 пикселей:
 * при ширине 1280 верх шапки идёт с 544 к **0** — шапка прилипла; при ширине 390 идёт с 773 к
 * **−127** — уехала вместе с таблицей. Вернуть её могла бы обёртка в разметке, но разметку этот
 * кусок не открывает.
 */
@media (max-width: 48rem) {
  .items {
    overflow-x: auto;
  }
}

@media (max-width: 40rem) {
  body {
    padding: var(--spacingVerticalL) var(--spacingHorizontalL) var(--spacingVerticalXXL);
  }

  section {
    padding: var(--spacingVerticalL) var(--spacingHorizontalL);
  }

  /*
   * На узком экране пары разворачиваются в строки: подпись слева, число справа. Это и
   * единственная раскладка, которая тут читается, и ровно то, как владелец просил показывать
   * числа — подписи по левому краю, числа по правому.
   */
  dl {
    grid-template-columns: 1fr auto;
    gap: 0.55rem 1rem;
  }

  dt,
  dd {
    grid-row: auto;
  }

  dt {
    grid-column: 1;
    align-self: center;
  }

  dd {
    grid-column: 2;
    text-align: right;
    font-size: var(--fontSizeBase300);
    line-height: var(--lineHeightBase300);
  }

  .bottom-line dd {
    font-size: var(--fontSizeBase600);
    line-height: var(--lineHeightBase600);
  }

  /*
   * На узком экране полоса действия перестаёт быть плавающей.
   *
   * На широком она плавает нарочно — так кнопка обновления, кнопка выхода, название отчёта и
   * месяцы становятся одной полосой управления вместо двух. На узком места на это нет: название
   * зажималось в треть ширины и ломалось на три строки. Здесь кнопки уходят своей строкой, а
   * название получает всю ширину.
   */
  .actions {
    float: none;
    margin-left: 0;
  }
}
